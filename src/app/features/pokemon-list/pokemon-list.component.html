<div class="region-selector">
  @for (region of regions; track region.name) {
    <button
      class="region-btn"
      [class.active]="selectedRegion.name === region.name"
      (click)="selectRegion(region)"
    >
      {{ region.name }}
    </button>
  }
</div>

@if (loading) {
  <app-loader />
} @else {
  @if (isAllMode) {
    <app-paginator
      (nextPage)="nextPage()"
      (prevPage)="prevPage()"
    />
  }

  <div class="pokemon-grid">
    @for (pokemon of pokemons; track pokemon.name) {
      <app-pokemon-card
        [pokemon]="pokemon.name | capitalize"
        [imagen]="'https://img.pokemondb.net/artwork/large/' + pokemon.name + '.jpg'"
        (clickName)="clickName($event)"
      />
    }
  </div>
}

@if (showScrollTop) {
  <button class="scroll-top-btn" (click)="scrollToTop()" aria-label="Scroll to top">↑</button>
}
