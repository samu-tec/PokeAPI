<div class="card" (click)="onCardClick()">
  <div class="card-inner" [class.flipped]="isFlipped">
    <div class="card-front">
      <span class="pokemon-name-front">{{ pokemon | capitalize }}</span>
      <img [src]="imagen" [alt]="(pokemon | capitalize) + ' image'" />
    </div>
    <div class="card-back">
      <h1>{{ pokemon | capitalize }}</h1>
      <div class="back-actions">
        <button class="info-btn" (click)="$event.stopPropagation(); clickName.emit(pokemon)">
          <span class="span-mother">
            <span>+</span>
            <span>I</span>
            <span>n</span>
            <span>f</span>
            <span>o</span>
          </span>
          <span class="span-mother2">
            <span>T</span>
            <span>a</span>
            <span>p</span>
            <span>H</span>
            <span>e</span>
            <span>r</span>
            <span>e</span>
          </span>
        </button>
        <button
          class="compare-btn"
          [class.active]="isComparing"
          (click)="$event.stopPropagation(); compare.emit(pokemon)"
        >
          {{ isComparing ? '✔ Selected' : '⚖️ Compare' }}
        </button>
        <button
          class="team-btn-back"
          [class.in-team]="isInTeam()"
          (click)="$event.stopPropagation(); toggleTeam()"
        >
          {{ isInTeam() ? '🎒 In Team' : '🎒 Add Team' }}
        </button>
      </div>
    </div>
  </div>
</div>
